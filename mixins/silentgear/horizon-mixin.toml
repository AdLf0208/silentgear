[mod]
id = "silentgear"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "1d63e0a5a37a7a708eb0b32b49bf0dfeb28ed8a9"

# The pure gear model (standalone crate lib, injected as
# `crate::game::silentgear`).
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "silentgear"
source = "runtime.rs"

# Game-side glue: the inventory, the component write and the readouts.
[[module]]
id = "state"
file = "crates/horizon-client/src/game.rs"
name = "silentgear_state"
source = "support.rs"

# The content half is inside this bundle (`data/silentgear-content.hmod`, the built
# `content/silentgear.hmod`): this writes it to `.horizon-cache/` and appends it to the
# dev-mod list, so one `.hnmod` installs the items and the code. The registry keeps one file per
# project, so a split port could not be listed; AE2 ships the same pattern.
[[injection]]
id = "embedded-content"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::mods::content_root"
helper = "embedded_content.rs"
bindings = [
  { name = "root", ty = "&std::path::Path", value = "root" },
  { name = "enabled", ty = "&std::collections::BTreeSet<String>", value = "enabled" },
  { name = "dev", ty = "&[std::path::PathBuf]", value = "dev" },
]

# Before content loads: register the `silentgear:gear` component id.
[[injection]]
id = "component-types"
hook = "component_types"
hook_version = 1
kind = "HEAD"
helper = "component_types.rs"
bindings = [
  { name = "types", ty = "&mut Vec<String>", value = "types" },
]

# `/silentgear ...`: the assembly and the stats readout.
[[injection]]
id = "register-commands"
hook = "register_commands"
hook_version = 1
kind = "HEAD"
helper = "register.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<NativeCommand>", value = "commands" },
]

[[injection]]
id = "perform-command"
hook = "perform_command"
hook_version = 1
kind = "HEAD"
helper = "perform.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "&NativeServerPlayer", value = "player" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "ran" },
]

# An assembled gear's tooltip gets its material stat lines.
[[injection]]
id = "gear-tooltip"
hook = "tooltip"
hook_version = 1
kind = "HEAD"
helper = "tooltip.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "lines", ty = "&mut Vec<(Text, u32)>", value = "lines" },
]
